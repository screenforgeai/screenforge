name: Release

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (mac-vX.Y.Z)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    # Release jobs need this org's signing/R2 secrets; skip them in forks.
    if: github.repository_owner == 'screenforgeai'
    runs-on: macos-latest
    environment: production
    timeout-minutes: 45

    env:
      CI: true
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Validate release tag input
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "RELEASE_TAG is required. Provide workflow_dispatch input 'tag' in vX.Y.Z format." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^mac-v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid RELEASE_TAG: ${RELEASE_TAG} (expected mac-vX.Y.Z)" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Configure pnpm linker for Electron Forge
        run: pnpm config set node-linker hoisted --location project

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Allow native DMG maker install build
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const packageJsonPath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
          const onlyBuiltDependencies = new Set(packageJson.pnpm?.onlyBuiltDependencies ?? []);

          onlyBuiltDependencies.add('electron');
          onlyBuiltDependencies.add('fs-xattr');
          onlyBuiltDependencies.add('macos-alias');

          packageJson.pnpm = {
            ...(packageJson.pnpm ?? {}),
            onlyBuiltDependencies: Array.from(onlyBuiltDependencies).sort(),
          };

          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit

      - name: Evaluate Apple signing and notarization readiness
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          required=(
            APPLE_CERTIFICATE_P12_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_API_PRIVATE_KEY
          )

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} == 0 )); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing/notarization is enabled for this run."
            exit 0
          fi

          echo "Production macOS auto-update releases require Apple signing/notarization secrets." >&2
          echo "Missing secrets: ${missing[*]}" >&2
          exit 1

      - name: Log signing and notarization mode
        run: |
          echo "Signing/notarization mode: enabled"

      - name: Import Apple signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          cert_path="$RUNNER_TEMP/screenforge-signing.p12"
          keychain_name="screenforge-signing-${GITHUB_RUN_ID}.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"

          security create-keychain -p "$keychain_password" "$keychain_name"
          security unlock-keychain -p "$keychain_password" "$keychain_name"
          security set-keychain-settings -lut 21600 "$keychain_name"
          security list-keychains -d user -s "$keychain_name"

          security import "$cert_path" -k "$keychain_name" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_name"

          echo "KEYCHAIN_NAME=$keychain_name" >> "$GITHUB_ENV"

      - name: Write notarization API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"

          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build native macOS helper
        run: pnpm build:native:macos

      - name: Derive macOS updater feed URL
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_RELEASE_PREFIX: ${{ vars.R2_RELEASE_PREFIX || 'screenforge' }}
        run: |
          set -euo pipefail

          if [[ -z "${R2_PUBLIC_BASE_URL:-}" ]]; then
            echo "R2_PUBLIC_BASE_URL is required to build the updater feed URL." >&2
            exit 1
          fi

          public_base="${R2_PUBLIC_BASE_URL%/}"
          release_prefix="${R2_RELEASE_PREFIX#/}"
          release_prefix="${release_prefix%/}"

          echo "SCREENFORGE_MAC_UPDATE_BASE_URL=${public_base}/${release_prefix}/updates/release/darwin/arm64" >> "$GITHUB_ENV"

      - name: Generate release notes from changelog
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#mac-v}"

          awk -v version="$version" '
            $0 == "## " version {
              in_section = 1
            }
            in_section && /^## / {
              if ($0 == "## " version) {
                print
                next
              }
              exit
            }
            in_section {
              print
            }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.raw.md"

          awk '
            NF {
              start = NR
              end = NR
            }
            {
              lines[NR] = $0
            }
            END {
              if (!start) {
                exit 1
              }
              for (i = start; i <= end; i++) {
                print lines[i]
              }
            }
          ' "$RUNNER_TEMP/release-notes.raw.md" > "$RUNNER_TEMP/release-notes.md"

          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "No changelog section found in CHANGELOG.md for ${version}." >&2
            exit 1
          fi

          echo "SCREENFORGE_MAC_UPDATE_RELEASE_NOTES_PATH=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

          echo "Release notes for ${version}:"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Build macOS distributables
        env:
          SCREENFORGE_ENABLE_SIGNING: ${{ steps.signing.outputs.enabled }}
          SCREENFORGE_MAC_UPDATE_BASE_URL: ${{ env.SCREENFORGE_MAC_UPDATE_BASE_URL }}
          SCREENFORGE_MAC_UPDATE_RELEASE_NOTES_PATH: ${{ env.SCREENFORGE_MAC_UPDATE_RELEASE_NOTES_PATH }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: node scripts/make-platform.mjs mac --arch arm64

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail

          artifact_files=()
          while IFS= read -r file; do
            artifact_files+=("$file")
          done < <(find out/make -type f \( -name "*.dmg" -o -name "*.zip" \) | sort)

          if (( ${#artifact_files[@]} == 0 )); then
            echo "No release artifacts found under out/make." >&2
            exit 1
          fi

          has_dmg=false
          for file in "${artifact_files[@]}"; do
            if [[ "$file" == *.dmg ]]; then
              has_dmg=true
              break
            fi
          done

          if [[ "$has_dmg" != "true" ]]; then
            echo "No .dmg files found under out/make." >&2
            exit 1
          fi

          : > out/make/SHA256SUMS
          for file in "${artifact_files[@]}"; do
            shasum -a 256 "$file" >> out/make/SHA256SUMS
          done

          echo "Generated checksums:"
          cat out/make/SHA256SUMS

      - name: Upload release files to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_RELEASE_PREFIX: ${{ vars.R2_RELEASE_PREFIX || 'screenforge' }}
          R2_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: bash scripts/upload-release-to-r2.sh

      - name: Publish draft GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up temporary keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          if [[ -n "${KEYCHAIN_NAME:-}" ]]; then
            security delete-keychain "$KEYCHAIN_NAME" || true
          fi
