name: Update Server Sync

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: update-server-sync-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  notify:
    # Release jobs need this org's signing/R2 secrets; skip them in forks.
    if: github.repository_owner == 'screenforgeai'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts/notify-update-server.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Notify update server webhook
        env:
          SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_RELEASE_PREFIX: ${{ vars.R2_RELEASE_PREFIX || 'screenforge' }}
        run: bash scripts/notify-update-server.sh
