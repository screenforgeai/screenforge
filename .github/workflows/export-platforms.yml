name: Export (all platforms)

# Real exports through the app on Linux, macOS and Windows: the chunked-export
# end-to-end test, then the export suite (without the chunked test, which
# already ran) once as a plain single-pass export and once through the chunk
# cache.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/export/**'
      - 'src/lib/effects/**'
      - 'src/lib/pixi/**'
      - 'src/components/ExportWorker.tsx'
      - 'src/hooks/useVideoExport.ts'
      - 'src/hooks/useExportPrerender.ts'
      - 'electron/modules/export/**'
      - 'electron/modules/ffmpeg/**'
      - 'electron/testing/**'
      - 'test/export/**'
      - '.github/workflows/export-platforms.yml'

permissions:
  contents: read

concurrency:
  group: export-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: export (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # The Linux runner has no GPU: render WebGL in software there.
      SCREENFORGE_SOFTWARE_GL: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fetch Electron now, so the first test does not spend its time limit
      # downloading it.
      - name: Install Electron binary
        shell: bash
        run: node node_modules/electron/install.js

      # Ubuntu runners block the unprivileged namespaces Chromium's sandbox
      # prefers, so it needs its setuid helper, which must be root-owned.
      - name: Set up Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Install display and shell (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb zsh

      - name: Download FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: pnpm download:ffmpeg:linux

      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm download:ffmpeg:windows

      # macOS uses the FFmpeg committed under native/bin/ffmpeg/darwin-arm64.

      - name: Chunked export, end to end
        shell: bash
        env:
          SCREENFORGE_EXPORT_CACHE_DIR: ${{ runner.temp }}/export-cache-e2e
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm exec vitest run --config vitest.export.config.ts test/export/chunked.integration.test.ts
          else
            pnpm exec vitest run --config vitest.export.config.ts test/export/chunked.integration.test.ts
          fi

      # The suite's harness launcher uses zsh and script(1), so it runs on
      # Linux and macOS only.
      - name: Export suite, single pass
        if: runner.os != 'Windows'
        shell: bash
        env:
          SCREENFORGE_EXPORT_CHUNKED: '0'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pnpm test:export test/export/export.integration.test.ts; else pnpm test:export test/export/export.integration.test.ts; fi

      - name: Export suite, through the chunk cache
        if: runner.os != 'Windows'
        shell: bash
        env:
          SCREENFORGE_EXPORT_CHUNKED: '1'
          SCREENFORGE_EXPORT_CACHE_DIR: ${{ runner.temp }}/export-cache-suite
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pnpm test:export test/export/export.integration.test.ts; else pnpm test:export test/export/export.integration.test.ts; fi
